<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-title" content="Portefeuille">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Mon portefeuille</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --border: rgba(11, 11, 11, 0.10); --axis: #c3c2b7; --accent: #2a78d6; --down: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
      --border: rgba(255, 255, 255, 0.10); --axis: #383835; --accent: #3987e5; --down: #e66767;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--page); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  p { margin: 0; color: var(--ink-2); font-size: 14px; }
  label { display: block; margin: 20px 0 6px; font-size: 14px; font-weight: 600; }
  input {
    width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--axis); border-radius: 10px;
    background: var(--page); color: var(--ink); font: inherit;
  }
  button {
    width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 10px;
    background: var(--ink); color: var(--surface); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #error { margin-top: 12px; color: var(--down); min-height: 1.45em; }
</style>
</head>
<body>
<form id="form">
  <h1>Mon portefeuille</h1>
  <p>Rapport protégé. Le mot de passe est retenu sur cet appareil.</p>
  <label for="password">Mot de passe</label>
  <input id="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <button id="submit" type="submit">Ouvrir</button>
  <p id="error" role="alert"></p>
</form>

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var STORE = "portefeuille-mot-de-passe";
  var form = document.getElementById("form");
  var input = document.getElementById("password");
  var button = document.getElementById("submit");
  var error = document.getElementById("error");

  function bytes(b64) {
    var raw = atob(b64), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // Même dérivation que protect.py : PBKDF2-SHA256 puis AES-256-GCM
  function decrypt(password) {
    var secret = new TextEncoder().encode(password.trim().normalize("NFC"));
    return crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: bytes(P.salt), iterations: P.iterations, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.nonce) }, key, bytes(P.data));
      })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }

  function saved() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function remember(password) { try { localStorage.setItem(STORE, password); } catch (e) {} }
  function forget() { try { localStorage.removeItem(STORE); } catch (e) {} }

  function open(password, fromStore) {
    button.disabled = true;
    error.textContent = "";
    decrypt(password).then(function (html) {
      remember(password);
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      button.disabled = false;
      if (fromStore) { forget(); return; }  // mot de passe changé depuis : on le redemande
      error.textContent = "Mot de passe incorrect.";
      input.select();
    });
  }

  if (!window.crypto || !crypto.subtle) {
    error.textContent = "Ce navigateur ne peut pas déchiffrer la page (connexion https requise).";
    button.disabled = true;
    return;
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); open(input.value, false); });
  var known = saved();
  if (known) open(known, true); else input.focus();
})();
</script>
</body>
</html>
